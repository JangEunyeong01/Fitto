# PR과 main에 들어온 커밋마다 앱 타입 검사·점검 스크립트와 서버 테스트를 돌린다.
# 로컬 PC에선 Gradle이 안 돌아서 서버 테스트를 손으로 돌려야 했다. 여기서 돌면 PR 화면에서 바로 보인다.
name: 검사

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# 같은 브랜치에 새 커밋이 오면 앞의 검사는 멈춘다.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: 앱 — 타입 검사·점검 스크립트
    runs-on: ubuntu-latest
    env:
      # 날짜 계산 점검(생리 주기·알림·기간)이 한국 시간 기준이다.
      TZ: Asia/Seoul
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # 피또 그림은 저장소에 없다(.gitignore). 같은 모양의 빈 도형 파일로 대신한다.
      - name: 피또 그림 자리 채우기
        run: cp src/theme/fittoSvgs.placeholder.ts src/theme/fittoSvgs.ts
      - name: 타입 검사
        run: npx tsc --noEmit
      - name: 점검 스크립트
        run: npm run check

  server:
    name: 서버 — 테스트
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: 테스트
        run: ./gradlew test --no-daemon
      # 실패하면 어느 테스트가 왜 깨졌는지 보고서를 받아 볼 수 있게 남긴다.
      - name: 테스트 보고서
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: server-test-report
          path: server/build/reports/tests/test
