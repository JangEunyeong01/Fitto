# 테스트 전용 설정. 여기 값이 src/main의 application.yaml을 덮는다.
#
# H2는 Postgres와 SQL 방언이 다르다. 이 테스트를 통과해도 Postgres에서 깨질 여지는 남는다
# (예: 예약어, 타입 매핑, 인덱스 문법). 그래서 여기서 보는 건 "서버가 뜨고 흐름이 이어지는가"까지고,
# 실제 DB 검증은 Postgres를 띄운 뒤에 한 번 더 한다.
spring:
  datasource:
    url: jdbc:h2:mem:fitto;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      # 테스트마다 스키마를 새로 만든다. 엔티티 매핑이 틀리면 여기서 바로 실패한다.
      ddl-auto: create-drop
    open-in-view: false

  flyway:
    # 스키마는 위 ddl-auto가 만든다. 마이그레이션은 Postgres용이라 H2에서 돌리지 않는다.
    # 이 파일이 src/main의 설정을 덮어쓰므로 여기에도 적어야 한다.
    enabled: false

  jackson:
    default-property-inclusion: always
    datatype:
      enum:
        write-enums-using-to-string: true
        read-enums-using-to-string: true

fitto:
  jwt:
    secret: test-secret-key-for-integration-tests-32bytes
    access-ttl: 30m
    refresh-ttl: 14d
  mail:
    # 메일을 실제로 보내지 않고 로그에 찍는다. 코드를 확인해야 하는 테스트는 MailSender를 바꿔 끼운다.
    log-codes: true

logging:
  level:
    org.hibernate.SQL: info
