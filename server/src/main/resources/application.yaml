spring:
  application:
    name: fitto-server

  datasource:
    # 로컬 개발용. 배포에서는 환경변수로 덮어쓴다(비밀번호를 저장소에 두지 않는다).
    url: ${DB_URL:jdbc:postgresql://localhost:5432/fitto}
    username: ${DB_USER:fitto}
    password: ${DB_PASSWORD:fitto}

  jpa:
    hibernate:
      # 스키마는 나중에 마이그레이션 도구로 관리한다. 지금은 엔티티 기준으로 자동 반영.
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    # 개발에서는 ddl-auto가 스키마를 만든다. 마이그레이션은 운영에서만 돌린다.
    enabled: false

  # 요청 본문 상한. 큰 요청으로 메모리를 밀어 넣는 걸 막는다.
  servlet:
    multipart:
      max-request-size: 2MB

  jackson:
    # null 필드도 그대로 내려보낸다. 명세 0-5에서 "0"과 "정보 없음"을 구분하기로 했다.
    default-property-inclusion: always
    datatype:
      # enum을 이름(FEMALE)이 아니라 toString()의 소문자 코드(female)로 주고받는다.
      # 코드값은 명세 1장에서 앱과 맞춰둔 문자열이라 서버 enum 이름과 따로 논다.
      # Jackson 3에서 이 설정이 Serialization/DeserializationFeature → EnumFeature로 옮겨졌다.
      enum:
        write-enums-using-to-string: true
        read-enums-using-to-string: true

fitto:
  jwt:
    # 로컬 개발용 기본값. 배포에서는 반드시 환경변수로 덮어쓴다(이 값이 있으면 토큰을 위조할 수 있다).
    secret: ${JWT_SECRET:local-dev-secret-change-me-32bytes-minimum}
    access-ttl: 30m
    refresh-ttl: 14d
  mail:
    # 메일 서비스를 붙이기 전까지 비밀번호 찾기·이메일 인증 코드를 서버 로그에 찍는다. 로컬 전용.
    # 운영(prod)에서 켜면 부팅이 실패한다(StartupSecurityCheck).
    log-codes: true

server:
  port: 8080

logging:
  level:
    # 개발 중에는 실행되는 쿼리를 본다. N+1을 눈으로 잡으려는 목적.
    org.hibernate.SQL: debug
