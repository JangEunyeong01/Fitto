# 운영 설정. `SPRING_PROFILES_ACTIVE=prod`로 켠다.
#
# 여기에는 기본값을 두지 않는다. 환경변수가 없으면 서버가 뜨지 않아야 한다 —
# 기본값이 있으면 설정을 빠뜨린 채 배포해도 겉으로는 정상으로 보인다.
spring:
  datasource:
    # 기본값을 빈 문자열로 둔 이유: 환경변수가 없을 때 스프링의 치환 실패 예외가 먼저 터지면
    # "무엇이 빠졌는지" 안내(StartupSecurityCheck)가 나올 기회가 없다. 비어 있는지는 그쪽에서 판단한다.
    url: ${DB_URL:}
    username: ${DB_USER:}
    password: ${DB_PASSWORD:}
    hikari:
      # 무료 티어 DB는 동시 연결 수가 적다. 넘치면 커넥션을 못 받아 요청이 줄줄이 막힌다.
      maximum-pool-size: ${DB_POOL_SIZE:5}

  jpa:
    hibernate:
      # 운영에서는 스키마를 자동으로 바꾸지 않는다. 엔티티와 실제 스키마가 다르면 부팅을 실패시킨다.
      # update로 두면 컬럼 이름 하나 바꿨을 때 옛 컬럼이 남고 데이터가 갈라진다.
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false

  flyway:
    enabled: true
    baseline-on-migrate: true

fitto:
  jwt:
    # 기본값 없음. 없으면 부팅 실패(StartupSecurityCheck).
    secret: ${JWT_SECRET:}
    access-ttl: 30m
    refresh-ttl: 14d
  cors:
    # 배포된 앱 주소만 허용한다. 쉼표로 여러 개.
    allowed-origins: ${CORS_ORIGINS:}
  signup:
    # 가입을 받을 이메일. 쉼표로 여러 개. 비우면 누구나 가입할 수 있다.
    allowed-emails: ${SIGNUP_ALLOWED_EMAILS:}
  mail:
    # 기본 설정(application.yaml)은 로컬용으로 켜져 있다. 여기서 꺼야 운영이 뜬다.
    # 메일 서비스를 붙이기 전까지 운영의 비밀번호 찾기·이메일 인증은 "지금은 메일을 보낼 수 없어요"로 거절된다.
    log-codes: false

server:
  port: ${PORT:8080}
  # 배포로 컨테이너가 교체될 때 처리 중이던 요청을 끝내고 종료한다.
  shutdown: graceful
  # 프록시(Render 등) 뒤에서 원래 프로토콜·IP를 읽는다.
  # framework(스프링)는 X-Forwarded-For의 맨 앞 값을 IP로 쓴다. 맨 앞은 요청을 보낸 쪽이 마음대로 넣을 수 있고,
  # Render는 들어온 값을 지우지 않고 뒤에 붙인다 — 운영 서버에 위조 헤더로 로그인 실패를 보내 보니 로그에 위조 IP가 찍혔다(2026-11).
  # 그대로면 IP 기준 제한(로그인·가입·비밀번호 찾기)을 헤더만 바꿔 피한다.
  # native(Tomcat RemoteIpValve)는 오른쪽 끝부터 읽으며 내부망 주소(Render 내부 프록시)를 건너뛰고 처음 나오는 바깥 주소를 쓴다.
  # 오른쪽 끝은 Render가 붙인 값이라 위조할 수 없다. 배포 뒤 같은 위조 요청으로 실제 IP가 찍히는지 확인한다(DEPLOY.md).
  forward-headers-strategy: native
  tomcat:
    # 요청 본문 상한. 게스트 기록 이전(POST /me/import)이 가장 큰 요청이라 넉넉히 두되 무제한은 아니다.
    max-http-form-post-size: 2MB
    max-swallow-size: 2MB

logging:
  level:
    root: info
    # 운영에서 쿼리 로그는 끈다. 값이 그대로 찍혀 민감 정보가 로그에 남는다.
    org.hibernate.SQL: warn
    com.fitto.server: info
